<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .hero { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 22px; align-items: start; padding: 22px; }
    .hero .ico { width: 84px; height: 84px; border-radius: 4px; background: var(--cat); color: var(--cat-ink); display: grid; place-items: center; }
    .hero .ico svg { width: 58px; height: 58px; stroke-width: 1.5; }
    .hero h1 { font-size: 44px; line-height: .95; }
    .facts { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 16px; }
    .fact .k { font-family: var(--f-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .fact .v { font-weight: 600; font-size: 18px; }
    .ring { width: 100px; height: 100px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 600; font-size: 28px; line-height: 1; }
    .ring .val small { display: block; font-family: var(--f-mono); font-size: 9px; color: var(--muted); letter-spacing: .08em; font-weight: 500; margin-top: 4px; }
    .cols { display: grid; grid-template-columns: 340px minmax(0, 1fr) 380px; gap: 18px; margin-top: 18px; align-items: start; }
    @media (max-width: 1250px) { .cols { grid-template-columns: 1fr 1fr; } .cols > :last-child { grid-column: 1 / -1; } }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; background: transparent; padding: 8px 0; margin-right: 18px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .tabs button.on { color: var(--ink); border-bottom-color: var(--cat); }
    .mem { display: grid; grid-template-columns: 20px 1fr; gap: 9px; font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .mem:last-child { border-bottom: none; }
    .mem .icon { color: var(--muted); margin-top: 3px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters button.on { border-color: var(--cat); color: var(--ink); box-shadow: inset 0 -2px 0 var(--cat); }
    #mini { height: 300px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
    .ask-log { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .bubble { font-size: 14px; max-width: 94%; }
    .bubble.me { align-self: flex-end; background: var(--s3); border-radius: 4px; padding: 7px 11px; font-weight: 500; }
    .bubble.bot { align-self: flex-start; border-left: 2px solid var(--cat); padding: 2px 0 2px 12px; }
    .trace { margin-top: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
    .qr-mini { width: 92px; height: 92px; background: #fff; border-radius: 3px; padding: 5px; display: block; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div class="page">
    <div class="panel hero" id="hero"><span class="sk" style="width:84px;height:84px"></span><div><span class="sk line" style="width:30%"></span><span class="sk title" style="height:40px;margin-top:10px"></span><span class="sk line" style="width:70%;margin-top:16px"></span></div><span class="sk" style="width:100px;height:100px;border-radius:50%"></span></div>
    <div class="cols">
      <div class="stack">
        <div class="panel panel-pad">
          <h3 data-i18n>What to watch</h3><div class="muted" style="font-size:13px;margin:2px 0 10px" data-i18n>Depends on who’s asking.</div>
          <div class="tabs" id="roleTabs"><button data-r="operator" class="on" data-i18n>Operator</button><button data-r="technician" data-i18n>Technician</button><button data-r="fleet_manager" data-i18n>Fleet manager</button></div>
          <div id="insights" style="margin-top:12px"></div>
        </div>
        <div class="panel panel-pad"><h3 style="margin-bottom:6px" data-i18n>On record about this machine</h3><div id="memory"></div></div>
        <div class="panel panel-pad"><h3 style="margin-bottom:8px" data-i18n>Still open</h3><div id="openItems"></div></div>
      </div>
      <div class="panel panel-pad">
        <div class="row spread" style="margin-bottom:12px;align-items:baseline"><h3 style="font-family:var(--f-display);font-size:28px;font-weight:700" data-i18n>History</h3><span class="count mono muted" style="font-size:12px" id="tlCount"></span></div>
        <div class="filters" id="filters"></div>
        <div id="timeline"></div>
      </div>
      <div class="stack">
        <div class="panel panel-pad">
          <div class="row spread" style="margin-bottom:10px"><h3 data-i18n>Ask about this machine</h3><span class="mono muted" style="font-size:12px" id="aiMode"></span></div>
          <div class="ask-log" id="askLog"></div>
          <form class="row" id="askForm"><input class="input" id="askInput" placeholder="Has the boom hose been replaced before?" autocomplete="off" data-i18n-attr="placeholder"><button class="btn primary" data-i18n>Ask</button></form>
          <div class="chips" style="margin-top:8px" id="askChips"></div>
        </div>
        <div class="panel panel-pad"><div class="row spread" style="margin-bottom:8px"><h3 data-i18n>What it’s connected to</h3><a id="graphLink" href="/graph" style="font-size:13px" data-i18n>Whole fleet</a></div><div id="mini"></div></div>
      </div>
    </div>
  </div>
  <script src="/vendor/vis-network/vis-network.min.js"></script>
  <script src="/i18n/es.js"></script>
  <script src="/i18n/hi.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/asset.js"></script>
</body>
</html>
