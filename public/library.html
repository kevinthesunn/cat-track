<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product library · Cat Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .drop { display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px; align-items: center; padding: 18px 16px; border: 1.5px dashed var(--line-strong); border-radius: 4px; cursor: pointer; transition: border-color .15s, background .15s; }
    .drop:hover, .drop.over { border-color: var(--cat); background: var(--s2); }
    .drop > .icon { grid-row: span 2; width: 30px; height: 30px; color: var(--muted); }
    .drop .t { font-weight: 600; }
    .drop .b { font-size: 13px; color: var(--muted); }
    .picked { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 10px; background: var(--s2); border: 1px solid var(--line); border-radius: 4px; font-size: 14px; }
    .field { margin-top: 14px; }
    .samples button { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-left: 2px solid var(--line-strong); padding: 6px 10px; margin-top: 6px; color: var(--ink-2); font-size: 14px; cursor: pointer; }
    .samples button:hover { border-left-color: var(--cat); color: var(--ink); }
    .doc-item { display: grid; grid-template-columns: 16px 1fr; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 10px 11px 12px; cursor: pointer; color: var(--ink); }
    .doc-item:first-child { border-top: 0; }
    .doc-item:hover { background: var(--s2); }
    .doc-item.sel { background: var(--s2); box-shadow: inset 4px 0 0 var(--cat); }
    .doc-item .tt { font-weight: 600; line-height: 1.3; }
    .doc-item .mm { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
    .state { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--faint); }
    .state.integrated { background: var(--good); border-radius: 1px; }
    .state.failed { background: var(--critical); border-radius: 1px; }
    .state.processing { border: 2px solid var(--cat); border-top-color: transparent; background: transparent; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .detail h2 { font-family: var(--f-display); font-weight: 700; font-size: 36px; line-height: 1; margin-top: 10px; }
    .meta-line { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-top: 8px; }
    .sec-title { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
    .steps { list-style: none; margin: 0; padding: 0; }
    .steps li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .steps li:first-child { border-top: 0; }
    .steps .b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--good); background: var(--good); margin-top: 3px; }
    .steps li.now .b { background: transparent; border-color: var(--cat); border-top-color: transparent; animation: spin .8s linear infinite; }
    .steps li.bad .b { background: var(--critical); border-color: var(--critical); border-radius: 2px; }
    .steps .d { color: var(--muted); font-size: 13px; }
    .steps .when { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
    table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.data th { text-align: left; font-family: var(--f-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-strong); }
    table.data td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.data td.num { font-family: var(--f-mono); white-space: nowrap; }
    .branch-group { margin-top: 10px; }
    .branch-group .label { margin-bottom: 6px; display: block; }
    a.chip { text-decoration: none; }
    a.chip:hover { border-color: var(--cat); color: var(--ink); }
    a.chip.new { border-color: var(--cat); }
  </style>
</head>
<body>
  <div id="top"></div>
  <div class="page">
    <div class="page-head">
      <div><div class="label" data-i18n>CAT Engineering</div><h1 style="margin-top:6px" data-i18n>Product library</h1><div class="sub" data-i18n>Spec sheets, policies and service bulletins for new products. The document agent reads each one and wires it into the knowledge graph, so field answers can cite it the same day.</div></div>
      <a class="btn" href="/engineering" data-i18n>Field issues</a>
    </div>
    <div class="grid-2">
      <div class="stack">
        <div class="panel panel-pad">
          <h3 data-i18n>Add a document</h3>
          <label class="drop" id="drop" style="margin-top:12px">
            <input type="file" id="file" class="hidden" accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.html,.htm">
            <span id="dropIcon"></span><span class="t" data-i18n>Drop a file here, or click to choose</span><span class="b" data-i18n>PDF, Word, text, Markdown or CSV · up to 15 MB</span>
          </label>
          <div class="picked hidden" id="picked"></div>
          <div class="field"><label class="lbl" for="docType" data-i18n>What it is</label>
            <select class="select" id="docType"><option value="spec_sheet" data-i18n>Spec sheet</option><option value="policy" data-i18n>Policy</option><option value="service_bulletin" data-i18n>Service bulletin</option><option value="manual" data-i18n>Manual</option><option value="other" data-i18n>Something else</option></select></div>
          <div class="field"><label class="lbl" for="product"><span data-i18n>Product or model</span> <span class="faint" style="text-transform:none;letter-spacing:0" data-i18n>(optional)</span></label>
            <input class="input" id="product" list="models" placeholder="Cat 337 HX" autocomplete="off"><datalist id="models"></datalist></div>
          <div class="field"><label class="lbl" for="uploader" data-i18n>Added by</label><select class="select" id="uploader"></select></div>
          <button class="btn primary block" id="go" style="margin-top:16px" disabled data-i18n>Add to the library</button>
          <div class="samples" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
            <div class="muted" style="font-size:13px" data-i18n>No file handy? Add a demo document:</div>
            <button data-sample="cat-337-hx-spec-sheet-DEMO.pdf" data-type="spec_sheet" data-product="Cat 337 HX" data-i18n>Spec sheet: Cat 337 HX excavator (PDF)</button>
            <button data-sample="hot-weather-operations-policy-DEMO.md" data-type="policy" data-product="" data-i18n>Policy: hot-weather operations (Markdown)</button>
            <button data-sample="service-bulletin-wl-transmission-DEMO.docx" data-type="service_bulletin" data-product="Cat 966" data-i18n>Service bulletin: Cat 966 transmission (Word)</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3 data-i18n>In the library</h3><span class="count" id="docCount"></span></div>
          <div id="docs" class="scroll" style="max-height:520px"></div>
        </div>
      </div>
      <div class="panel panel-pad detail" id="detail"></div>
    </div>
  </div>
  <script src="/i18n/es.js"></script>
  <script src="/i18n/hi.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/library.js"></script>
</body>
</html>
